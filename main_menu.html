<!DOCTYPE html>
<html lang="he">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מסך תפריט ראשי</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <script src="ProfilesList.js"></script>
  
  <style>
    body {
      background-color: #000; /* black background for streaming vibe */
      margin: 0;
      padding: 0;
    }
    /* Style for the navbar */
    .navbar {
      background-color: #141414; /* dark background similar to Netflix */
    }
    /* Logo styling */
    .navbar-brand img {
      height: 40px;
    }

    .navbar .btn {
        text-decoration: none;
    }

    .navbar .btn:hover {
        background-color: #343434;
        transform: scale(1.03);
        border-bottom: 3px solid #797cc2;
    }
  </style>
  <style>
    .movie-row {
      gap: 10px;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .movie-item {
      width: 200px;
      flex-shrink: 0;
    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .movie-poster:hover {
      transform: scale(1.05);
    }

    .movie-title {
      font-size: 14px;
      font-weight: bold;
      color: aquamarine;
      text-shadow: #555;
      padding-right: 2px;
    }
  </style>
</head>
<body dir="rtl">
  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
      <!-- Logo -->
      <a class="navbar-brand" href="#">
        <img src="CORNFLEX2.png" alt="Logo" />
      </a>
      <!-- Navigation buttons -->
      <div class="d-flex ms-auto">
        <button class="btn btn-link text-white mx-2">מסך הבית</button>
        <button class="btn btn-link text-white mx-2">סדרות</button>
        <button class="btn btn-link text-white mx-2">סרטים</button>
        <button class="btn btn-link text-white mx-2">חדש ופופולרי</button>
        <button class="btn btn-link text-white mx-2">הרשימה שלי</button>
      </div>
      <!-- Search Field -->
      <div class="me-3 ms-4">
        <input type="text" class="form-control form-control-sm" placeholder="חיפוש..." />
      </div>

      <!-- Profile Info & Logout -->
      <div class="d-flex align-items-center">
        <!-- Profile Image -->
        <img id="profileImg" alt="Profile" class="rounded-circle ms-1" style="width:40px; height:40px; object-fit:cover;" />

        <!-- Greeting -->
        <span class="text-white ms-3" id="greeting">Hello, User</span>

        <!-- Logout Button -->
        <button class="btn btn-outline-light text-white btn-sm ms-3" id="logoutBtn">החוצה</button>
      </div>
    </div>
  </nav>

  <!-- Rest of the page is blank -->
  <div style="height: calc(100vh - 56px);">
    <div class="movie-feed-container my-4">
      <h2 class="text-white mx-4">הכי שווים</h2>
      <div class="movie-row d-flex overflow-auto px-4">
        <!-- Movie/TV posters will be injected here -->

    // Assume your profile name is stored in localStorage under 'profileName'
    const profileId = localStorage.getItem('profileId') || 1;
    const profile = profilesList.find(e => e.id == profileId);

    // Set greeting message
    document.getElementById('greeting').textContent = `שלום, ${profile.name}`;

    document.getElementById('profileImg').src = profile.img;

    // Logout button functionality
    document.getElementById('logoutBtn').addEventListener('click', () => {
      // Clear localStorage and redirect to login page
      localStorage.clear();
      window.location.href = 'login.html'; // change to your login page URL
    });
  </script>

      itemDiv.appendChild(titleDiv);

        alert(`You clicked on ${movie.title}`);
      });

      document.querySelector('.movie-row').appendChild(itemDiv);

    });

    rowContainer.addEventListener('wheel', (e) => {
      e.preventDefault(); // Prevent default page scroll
      const delta = -Math.sign(e.deltaY);
      // Scroll left or right based on wheel direction
      const scrollAmount = delta * 300; // Adjust 100 for scroll speed
      rowContainer.scrollBy({
        left: scrollAmount,
        behavior: 'smooth'
      });
