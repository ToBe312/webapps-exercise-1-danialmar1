    const baseImageUrl = "images/"; // or your image base URL

    const rowContainer = document.querySelector('.movie-row');


    function createFeed(moviesArr) {
      moviesArr.forEach(movie => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'movie-item';

        const img = document.createElement('img');
        img.src = baseImageUrl + movie.poster_path;
        img.alt = movie.title;
        img.className = 'movie-poster';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'movie-title';
        titleDiv.textContent = movie.title;

        // Like button container
        const likeContainer = document.createElement('div');
        likeContainer.className = 'like-container d-flex align-items-center';

        // Like icon using emoji
        const likeIcon = document.createElement('button');
        likeIcon.type = 'button';
        likeIcon.className = 'btn btn-sm p-0 m-0 like-b';
        likeIcon.style.fontSize = '1.5rem';

        // Initialize liked state and count
        let count = localStorage.getItem('movies/'+movie.id) || 0;
        let liked = count > 0 ? true: false;

        // Set initial emoji
        likeIcon.textContent = liked ? '👍' : '🖒';//'🤍'; // hollow heart as placeholder, or you can use 👍

        // Like count span
        const likeCount = document.createElement('span');
        likeCount.className = 'ms-2';
        likeCount.textContent = count;

        // Append icon and count
        likeContainer.appendChild(likeIcon);
        likeContainer.appendChild(likeCount);

        // Toggle like on click
        likeIcon.addEventListener('click', (e) => {
          //e.preventDefault();
          likeIcon.textContent = '👍'; // filled thumbs-up
          count++;
          localStorage.setItem('movies/'+movie.id, count);
          likeCount.textContent = count;
        });


        itemDiv.appendChild(img);
        itemDiv.appendChild(titleDiv);

        //likeContainer.style.bottom = '10px';
        //likeContainer.style.right = '10px';
        //likeContainer.style.backgroundColor = 'rgba(0, 0, 0, 0.6)';
        likeContainer.style.padding = '5px 10px';
        likeContainer.style.borderRadius = '20px';

        itemDiv.appendChild(likeContainer);

        // Optional: add click event
        itemDiv.addEventListener('click', () => {
          //alert(`You clicked on ${movie.title}`);
        });

        document.querySelector('.movie-row').appendChild(itemDiv);

      });
    }
    createFeed(movies);

    items = Array.from(document.querySelectorAll('.movie-row .movie-item'));

    rowContainer.addEventListener('wheel', (e) => {
      e.preventDefault(); // Prevent default page scroll
      const delta = -Math.sign(e.deltaY);
      // Scroll left or right based on wheel direction
      const scrollAmount = delta * 300; // Adjust 100 for scroll speed
      rowContainer.scrollBy({
        left: scrollAmount,
        behavior: 'smooth'
      });
    });

    const searchInput = document.getElementById('search');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();

      items.forEach(item => {
        const text = item.querySelector('.movie-title').textContent.toLowerCase();
        if (text.includes(query)) {
          // Show
          item.style.display = 'block'; // Make it visible
          // Allow layout to update
          requestAnimationFrame(() => {
            item.classList.remove('hide');
          });
        } else {
          // Animate out
          item.classList.add('hide');

          // After transition, set display:none
          item.addEventListener('transitionend', () => {
            if (item.classList.contains('hide')) {
              item.style.display = 'none';
            }
          }, { once: true });
        }
      });

    });

    document.getElementById('sortBtn').addEventListener('click', () => {
      const m = movies.sort((a, b) => a.title.localeCompare(b.title));
      rowContainer.innerHTML = '';
      createFeed(m);
    });

  </script>
