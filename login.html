<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מסך התחברות</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <style>
  /* Background style */
  #vidBackground {
	  position: fixed;
	  right: 0;
	  bottom: 0;
	  min-width: 100%;
	  min-height: 100%;
  }
  </style>
</head>
<body dir=rtl class="bg-light d-flex align-items-center justify-content-center vh-100">
  <video autoplay muted loop id="vidBackground">
	<source src="back3.mp4" type="video/mp4">
  </video>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card shadow p-4 rounded" style="background-color: antiquewhite; opacity: 0.8;">
          <h3 class="card-title text-center mb-4">כניסה לחשבון</h3>
          <form>
            <div class="mb-3">
              <label for="email" class="form-label">כתובת אימייל</label>
              <input type="email" class="form-control" id="email" placeholder="הזן כאן אימייל..." required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">סיסמא</label>
              <input type="password" class="form-control" id="password" placeholder="הזן כאן סיסמא..." required />
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" />
                <label class="form-check-label" for="rememberMe">
                  זכרו אותי
                </label>
              </div>
              <a href="#" class="small text-decoration-none">שכחת את הסיסמה?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100">היכנס</button>
            <div class="text-center">
              <p class="mb-0">אין לך מנוי אצלנו? זה הזמן  <a href="#" class="text-decoration-none">להצטרף</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
