<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מסך התחברות</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body dir="rtl">
    <div>
        <h3>כניסה לחשבון</h3>
        <form>
        <div>
            <label>כתובת אימייל</label>
            <input type="email" id="email" placeholder="הזן כאן אימייל..." required />
        </div>
        <div class="mb-3">
            <label for="password">סיסמא</label>
            <input type="password" id="password" placeholder="הזן כאן סיסמא..." required />
        </div>
        <button type="submit">היכנס</button>
        </form>
    </div>
      
</body>
</html>
