<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מסך פרופילים</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <script src="ProfilesList.js"></script>
  
  <style>
    body {
      background-color: #141414;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px;
    }

    .profiles-container {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin-bottom: 40px;
      font-weight: bold;
    }

    .profiles {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }

    .profile {
      cursor: pointer;
      width: 150px;
      text-align: center;
    }

    .profile-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid transparent;
      transition: border 0.3s, transform 0.3s;
    }

    .profile-img:hover {
      border-color: #e50914;
      transform: scale(1.05);
    }

    .profile-name {
      margin-top: 8px;
      font-size: 1rem;
      width: 100%;
      border: none;
      background: transparent;
      color: #fff;
      text-align: center;

    }

    .profile-name:focus {
      outline: none;
      border-bottom: 1px dashed #e50914;
    }
  </style>

</head>
<body dir=rtl>
  <div class="profiles-container">
    <h1>מי צופה?</h1>
    <div class="profiles">
      <!-- Profiles will be generated here by JavaScript -->
    </div>
  </div>

  <script>
  
    const container = document.querySelector('.profiles');

    // Clear existing content if any
    container.innerHTML = '';

    profilesList.forEach(profile => {
      // Create the profile div
      const profileDiv = document.createElement('div');
      profileDiv.className = 'profile';

      // Create the image element
      const img = document.createElement('img');
      img.src = profile.img;
      img.className = 'profile-img';

      // Create the input element
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'profile-name';
      input.value = profile.name;

      // Append image and input to the profile div
      profileDiv.appendChild(img);
      profileDiv.appendChild(input);

      // Append the profile div to the container
      container.appendChild(profileDiv);
  });
</script>
</body>
</html>
