<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מסך תפריט ראשי</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <style>
    body {
      background-color: #000; /* black background for streaming vibe */
      margin: 0;
      padding: 0;
    }
    /* Style for the navbar */
    .navbar {
      background-color: #141414; /* dark background similar to Netflix */
    }
    /* Logo styling */
    .navbar-brand img {
      height: 40px;
    }

    .navbar .btn {
        text-decoration: none;
    }

    .navbar .btn:hover {
        background-color: #343434;
        transform: scale(1.03);
        border-bottom: 3px solid #797cc2;
    }

    .profile-name {
      text-decoration: none;
      color: white;
    }
    .profile-name:hover {
      text-decoration: underline;
    }
  </style>
  <style>
    .movie-row {
      gap: 10px;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .movie-item {
      width: 200px;
      flex-shrink: 0;
      transition: opacity 0.3s, max-height 0.3s;
      /*max-height: 100px; /* or some max value */

    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .movie-poster:hover {
      transform: scale(1.05);
    }

    .movie-title {
      font-size: 14px;
      font-weight: bold;
      color: aquamarine;
      text-shadow: #555;
      padding-right: 2px;
    }

    /* Optional: add hover effect for the like container if you want to animate opacity */
    .like-container {
      opacity: 0;
      transition: opacity 0.3s;
      color: pink;
    }

    .movie-item:hover .like-container {
      opacity: 1;
    }

    .like-b {
      color: #ccc;
      font-size: 30px;
    }

    .hide {
      opacity: 0;
      max-height: 0;
    }

    .sort-button {
      opacity: 0;
      transition: opacity 0.3s;

      font-size: 20px;
      cursor: pointer;
    }

    .movie-feed-container h2:hover .sort-button {
      opacity: 1;
    }
  </style>
</head>
<body dir="rtl">
  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
      <!-- Logo -->
      <a class="navbar-brand" href="#">
        <img src="images/CORNFLEX2.png" alt="Logo" />
      </a>
      <!-- Navigation buttons -->
      <div class="d-flex ms-auto">
        <button class="btn btn-link text-white mx-2" onclick="window.location.href='main_menu.html'">מסך הבית</button>
        <button class="btn btn-link text-white mx-2">סדרות</button>
        <button class="btn btn-link text-white mx-2">סרטים</button>
        <button class="btn btn-link text-white mx-2">חדש ופופולרי</button>
        <button class="btn btn-link text-white mx-2">הרשימה שלי</button>
      </div>
      <!-- Search Field -->
      <div class="me-3 ms-4">
        <input id="search" type="text" class="form-control form-control-sm" placeholder="חיפוש..." />
      </div>

      <!-- Profile Info & Logout -->
      <div class="d-flex align-items-center">
        <!-- Profile Image -->
        <img id="profileImg" alt="Profile" class="rounded-circle ms-1" style="width:40px; height:40px; object-fit:cover;" />

        <!-- Greeting -->
        <span class="text-white ms-3" id="greeting">Hello, User</span>

        <!-- Logout Button -->
        <button class="btn btn-outline-light text-white btn-sm ms-3" id="logoutBtn">החוצה</button>
      </div>
    </div>
  </nav>

  <!-- Rest of the page -->
  <div id="mainPanel" style="height: calc(100vh - 56px);">
    

  </div>

  <script>
    // Assume your profile name is stored in localStorage under 'profileName'
    const profile = JSON.parse(localStorage.getItem('profile')) || {
      '_id': 0,
      'name': 'User',
      'img': ''
    };

    // Set greeting message
    document.getElementById('greeting').innerHTML = `שלום, <a href='profiles.html' class="profile-name ms-3">${profile.name}</a>`;

    document.getElementById('profileImg').src = `profile_images/${profile.img}`;

    // Logout button functionality
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
          const res = await fetch('/user/logout', {
            method: 'POST',
          });
          
          const data = await res.json();
          if (res.ok) {
            // Clear localStorage and redirect to login page
            localStorage.clear();

            window.location.href = 'login.html';
          }
          else {
            alert('שגיאה: ' + data.error);
          }
        } catch (err) {
          alert('אין חיבור לשרת');
        }
    });
  </script>

  <script>
    

    const baseImageUrl = "images/";

    async function loadMovies() {
      const res = await fetch('/content/movies');
      const movies = await res.json();

      const container = document.getElementById('mainPanel');
      container.innerHTML += `
        <div class="movie-feed-container my-4">
          <h2 class="text-white mx-4">
            סרטים
            <a id="sortBtn" class="small text-decoration-none sort-button">מיין לפי שם (א"ב)</a>
          </h2>
          <div class="movie-row d-flex overflow-auto px-4">
            ${movies.map(m =>
              `
              <div class="movie-item"  onclick="window.location.href = '/content_details.html?type=movie&id=${m._id}'">
                <img src="${baseImageUrl + m.posterPath}" alt="${m.title}" class="movie-poster">
                <div class="movie-title">
                  ${m.title}
                </div>
                <div class="like-container d-flex align-items-center" style="padding: 5px 10px; border-radius: 20px;">
                  <button type="button" class="btn btn-sm p-0 m-0 like-b" style="font-size: 1.5rem;">👍</button>
                </div>
              </div>`
            ).join('')}
          </div>
        </div>
      `;
    }

    async function loadSeries() {
      const res = await fetch('/content/series');
      const series = await res.json();

      const container = document.getElementById('mainPanel');
      container.innerHTML += `
        <div class="movie-feed-container my-4">
          <h2 class="text-white mx-4">
            סדרות
            <a id="sortBtn" class="small text-decoration-none sort-button">מיין לפי שם (א"ב)</a>
          </h2>
          <div class="movie-row d-flex overflow-auto px-4">
            ${series.map(m =>
              `
              <div class="movie-item"  onclick="window.location.href = '/content_details.html?type=series&id=${m._id}'">
                <img src="${baseImageUrl + m.posterPath}" alt="${m.title}" class="movie-poster">
                <div class="movie-title">
                  ${m.title}
                </div>
                <div class="like-container d-flex align-items-center" style="padding: 5px 10px; border-radius: 20px;">
                  <button type="button" class="btn btn-sm p-0 m-0 like-b" style="font-size: 1.5rem;">👍</button>
                </div>
              </div>`
            ).join('')}
          </div>
        </div>
      `;
    }

    async function loadContinueWatching(profileId) {
      const res = await fetch(`/watch/continue?profileId=${profile._id.toString()}`);
      const items = await res.json();
      
      
      const container = document.getElementById('mainPanel');
      container.innerHTML += `
        <div class="movie-feed-container my-4">
          <h2 class="text-white mx-4">
            המשך צפייה
            <a id="sortBtn" class="small text-decoration-none sort-button">מיין לפי שם (א"ב)</a>
          </h2>
          <div class="movie-row d-flex overflow-auto px-4">
            ${items.map(m => {
              const imageUrl = m.posterUrl.startsWith('http') ? m.posterUrl : baseImageUrl + m.posterUrl;
              console.log(imageUrl);
              return `
              <div class="movie-item" onclick="${(m.type === 'Movie') ? 
                "window.location.href = '/player.html?type=movie&id=" + m.contentId + "'"
                : "window.location.href = '/player.html?type=series&id=" + m.seriesId._id + "&episodeId=" + m.contentId +"'"
                }">
                <img src="${imageUrl}" alt="${m.title}" class="movie-poster">
                <div class="movie-title">
                  ${m.title}
                </div>
                <div class="like-container d-flex align-items-center" style="padding: 5px 10px; border-radius: 20px;">
                  <button type="button" class="btn btn-sm p-0 m-0 like-b" style="font-size: 1.5rem;">👍</button>
                </div>
              </div>`
            }).join('')}
          </div>
        </div>
      `;

    }

    async function loadRecommendations(profileId) {
      try {
      const res = await fetch(`/recommendations?profileId=${profile._id.toString()}`);
      const data = await res.json();

      const shuffled = [...data.movies, ...data.series].sort(() => Math.random() - 0.5);

      const container = document.getElementById('mainPanel');
      container.innerHTML += `
        <div class="movie-feed-container my-4">
          <h2 class="text-white mx-4">
            המלצות אישיות
            <a id="sortBtn" class="small text-decoration-none sort-button">מיין לפי שם (א"ב)</a>
          </h2>
          <div class="movie-row d-flex overflow-auto px-4">
            ${shuffled.map(m =>
              `
              <div class="movie-item"  onclick="window.location.href = '/content_details.html?type=movie&id=${m._id}'">
                <img src="${baseImageUrl + m.posterPath}" alt="${m.title}" class="movie-poster">
                <div class="movie-title">
                  ${m.title}
                </div>
                <div class="like-container d-flex align-items-center" style="padding: 5px 10px; border-radius: 20px;">
                  <button type="button" class="btn btn-sm p-0 m-0 like-b" style="font-size: 1.5rem;">👍</button>
                </div>
              </div>`
            ).join('')}
          </div>
        </div>
      `;
      }
      catch(err) { console.log(err) }
    }

    async function loadByGenres() {
      let genres = await fetch('/genres');
      genres = await genres.json();
      const res = await fetch('by-genre');
      const data = await res.json();
      console.log(data)
      console.log(genres)
      //return;
      const container = document.getElementById('mainPanel');
      for(s in data) {
        const series = data[s];
        const gen = genres.find(e => e.id == s);
        if(!gen) continue;
        const genreName = gen.name;
        console.log(genreName);
        container.innerHTML += `
        <div class="movie-feed-container my-4">
          <h2 class="text-white mx-4">
          ${genreName}
            <a id="sortBtn" class="small text-decoration-none sort-button">מיין לפי שם (א"ב)</a>
          </h2>
          <div class="movie-row d-flex overflow-auto px-4">
            ${series.map(m =>
              `
              <div class="movie-item"  onclick="window.location.href = '/content_details.html?type=series&id=${m._id}'">
                <img src="${baseImageUrl + m.posterPath}" alt="${m.title}" class="movie-poster">
                <div class="movie-title">
                  ${m.title}
                </div>
                <div class="like-container d-flex align-items-center" style="padding: 5px 10px; border-radius: 20px;">
                  <button type="button" class="btn btn-sm p-0 m-0 like-b" style="font-size: 1.5rem;">👍</button>
                </div>
              </div>`
            ).join('')}
          </div>
        </div>
      `;
      }
      //return;
      
    }

// load all genres dynamically
async function loadAllGenres() {
  try {
    const res = await fetch('/genres');

    for (let g of genres) {
      await loadGenreRow(g.id, g.name);
    }
  } catch (err) {
    console.error('Error loading genres:', err);
  }
}

async function loadGenreRow(genreId, genreName) {
  try {
    const res = await fetch(`/genres/${genreId}`); 
    const items = await res.json(); 
    const moviesAndSeries = [...(items.movies || []), ...(items.series || [])];

    const container = document.getElementById('mainPanel');
    container.innerHTML += `
      <div class="movie-feed-container my-4">
        <h2 class="text-white mx-4">
          ${genreName}
          <a class="small text-decoration-none sort-button">מיין לפי שם (א"ב)</a>
        </h2>
        <div class="movie-row d-flex overflow-auto px-4">
          ${moviesAndSeries.map(m => `
            <div class="movie-item" onclick="window.location.href='/content_details.html?type=movie&id=${m._id}'">
              <img src="${baseImageUrl + m.posterPath}" alt="${m.title}" class="movie-poster">
              <div class="movie-title">${m.title}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } catch (err) {
    console.error(`Error loading genre ${genreName}:`, err);
  }
}



    async function load_feed() {

      await loadMovies();
      await loadSeries();
      await loadContinueWatching();
      await loadRecommendations();

      //await loadAllGenres();
      await loadByGenres();
      
      const rowContainer = document.querySelectorAll('.movie-row');
      rowContainer.forEach(r => r.addEventListener('wheel', (e) => {
        e.preventDefault(); // Prevent default page scroll
        const delta = -Math.sign(e.deltaY);
        // Scroll left or right based on wheel direction
        const scrollAmount = delta * 300; // Adjust 100 for scroll speed
        r.scrollBy({
          left: scrollAmount,
          behavior: 'smooth'
        });
      }));
    }
    load_feed();

  </script>

</body>
</html>
