<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מסך תפריט ראשי</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <style>
    body {
      background-color: #000; /* black background for streaming vibe */
      margin: 0;
      padding: 0;
    }
    /* Style for the navbar */
    .navbar {
      background-color: #141414; /* dark background similar to Netflix */
    }
    /* Logo styling */
    .navbar-brand img {
      height: 40px;
    }

    .navbar .btn {
        text-decoration: none;
    }

    .navbar .btn:hover {
        background-color: #343434;
        transform: scale(1.03);
        border-bottom: 3px solid #797cc2;
    }
  </style>
  <style>
    .movie-row {
      gap: 10px;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .movie-item {
      width: 200px;
      flex-shrink: 0;
      transition: opacity 0.3s, max-height 0.3s;
      /*max-height: 100px; /* or some max value */

    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .movie-poster:hover {
      transform: scale(1.05);
    }

    .movie-title {
      font-size: 14px;
      font-weight: bold;
      color: aquamarine;
      text-shadow: #555;
      padding-right: 2px;
    }

    /* Optional: add hover effect for the like container if you want to animate opacity */
    .like-container {
      opacity: 0;
      transition: opacity 0.3s;
      color: pink;
    }

    .movie-item:hover .like-container {
      opacity: 1;
    }

    .like-b {
      color: #ccc;
      font-size: 30px;
    }

    .hide {
      opacity: 0;
      max-height: 0;
    }

    .sort-button {
      opacity: 0;
      transition: opacity 0.3s;

      font-size: 20px;
      cursor: pointer;
    }

    .movie-feed-container h2:hover .sort-button {
      opacity: 1;
    }
  </style>
</head>
<body dir="rtl">
  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
      <!-- Logo -->
      <a class="navbar-brand" href="#">
        <img src="images/CORNFLEX2.png" alt="Logo" />
      </a>
      <!-- Navigation buttons -->
      <div class="d-flex ms-auto">
        <button class="btn btn-link text-white mx-2">מסך הבית</button>
        <button class="btn btn-link text-white mx-2">סדרות</button>
        <button class="btn btn-link text-white mx-2">סרטים</button>
        <button class="btn btn-link text-white mx-2">חדש ופופולרי</button>
        <button class="btn btn-link text-white mx-2">הרשימה שלי</button>
      </div>
      <!-- Search Field -->
      <div class="me-3 ms-4">
        <input id="search" type="text" class="form-control form-control-sm" placeholder="חיפוש..." />
      </div>

      <!-- Profile Info & Logout -->
      <div class="d-flex align-items-center">
        <!-- Profile Image -->
        <img id="profileImg" alt="Profile" class="rounded-circle ms-1" style="width:40px; height:40px; object-fit:cover;" />

        <!-- Greeting -->
        <span class="text-white ms-3" id="greeting">Hello, User</span>

        <!-- Logout Button -->
        <button class="btn btn-outline-light text-white btn-sm ms-3" id="logoutBtn">החוצה</button>
      </div>
    </div>
  </nav>

  <!-- Rest of the page -->
  <div id="mainPanel" style="height: calc(100vh - 56px);">
    

  </div>

  <script>
    // Assume your profile name is stored in localStorage under 'profileName'
    const profile = JSON.parse(localStorage.getItem('profile')) || {
      '_id': 0,
      'name': 'User',
      'img': ''
    };

    // Set greeting message
    document.getElementById('greeting').textContent = `שלום, ${profile.name}`;

    document.getElementById('profileImg').src = `profile_images/${profile.img}`;

    // Logout button functionality
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
          const res = await fetch('/user/logout', {
            method: 'POST',
          });
          
          const data = await res.json();
          if (res.ok) {
            // Clear localStorage and redirect to login page
            localStorage.clear();

            window.location.href = 'login.html';
          }
          else {
            alert('שגיאה: ' + data.error);
          }
        } catch (err) {
          alert('אין חיבור לשרת');
        }
    });
  </script>

  <script>
    

    const baseImageUrl = "images/";

    async function loadMovies() {
      const res = await fetch('/content/movies');
      const movies = await res.json();

      const container = document.getElementById('mainPanel');
      container.innerHTML += `
        <div class="movie-feed-container my-4">
          <h2 class="text-white mx-4">
            סרטים
            <a id="sortBtn" class="small text-decoration-none sort-button">מיין לפי שם (א"ב)</a>
          </h2>
          <div class="movie-row d-flex overflow-auto px-4">
            ${movies.map(m =>
              `
              <div class="movie-item">
                <img src="${baseImageUrl + m.posterPath}" alt="${m.title}" class="movie-poster">
                <div class="movie-title">
                  ${m.title}
                </div>
                <div class="like-container d-flex align-items-center" style="padding: 5px 10px; border-radius: 20px;">
                  <button type="button" class="btn btn-sm p-0 m-0 like-b" style="font-size: 1.5rem;">👍</button>
                </div>
              </div>`
            ).join('')}
          </div>
        </div>
      `;
    }

    async function loadSeries() {
      const res = await fetch('/content/series');
      const series = await res.json();

      const container = document.getElementById('mainPanel');
      container.innerHTML += `
        <div class="movie-feed-container my-4">
          <h2 class="text-white mx-4">
            סדרות
            <a id="sortBtn" class="small text-decoration-none sort-button">מיין לפי שם (א"ב)</a>
          </h2>
          <div class="movie-row d-flex overflow-auto px-4">
            ${series.map(m =>
              `
              <div class="movie-item">
                <img src="${baseImageUrl + m.posterPath}" alt="${m.title}" class="movie-poster">
                <div class="movie-title">
                  ${m.title}
                </div>
                <div class="like-container d-flex align-items-center" style="padding: 5px 10px; border-radius: 20px;">
                  <button type="button" class="btn btn-sm p-0 m-0 like-b" style="font-size: 1.5rem;">👍</button>
                </div>
              </div>`
            ).join('')}
          </div>
        </div>
      `;
    }

    async function load_feed() {

      await loadMovies();
      await loadSeries();

      const rowContainer = document.querySelectorAll('.movie-row');
      rowContainer.forEach(r => r.addEventListener('wheel', (e) => {
        e.preventDefault(); // Prevent default page scroll
        const delta = -Math.sign(e.deltaY);
        // Scroll left or right based on wheel direction
        const scrollAmount = delta * 300; // Adjust 100 for scroll speed
        r.scrollBy({
          left: scrollAmount,
          behavior: 'smooth'
        });
      }));
    }
    load_feed();

    function createFeed(moviesArr) {
      moviesArr.forEach(movie => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'movie-item';

        const img = document.createElement('img');
        img.src = baseImageUrl + movie.posterPath;
        img.alt = movie.title;
        img.className = 'movie-poster';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'movie-title';
        titleDiv.textContent = movie.title;

        // Like button container
        const likeContainer = document.createElement('div');
        likeContainer.className = 'like-container d-flex align-items-center';

        // Like icon using emoji
        const likeIcon = document.createElement('button');
        likeIcon.type = 'button';
        likeIcon.className = 'btn btn-sm p-0 m-0 like-b';
        likeIcon.style.fontSize = '1.5rem';

        // Initialize liked state and count
        let count = localStorage.getItem('movies/'+movie.id) || 0;
        let liked = count > 0 ? true: false;

        // Set initial emoji
        likeIcon.textContent = liked ? '👍' : '🖒';//'🤍'; // hollow heart as placeholder, or you can use 👍

        // Like count span
        const likeCount = document.createElement('span');
        likeCount.className = 'ms-2';

        // Append icon and count
        likeContainer.appendChild(likeIcon);
        likeContainer.appendChild(likeCount);

        // Toggle like on click
        likeIcon.addEventListener('click', (e) => {
          //e.preventDefault();
          likeIcon.textContent = '👍'; // filled thumbs-up
          localStorage.setItem('movies/'+movie.id, liked);
        });


        itemDiv.appendChild(img);
        itemDiv.appendChild(titleDiv);

        //likeContainer.style.bottom = '10px';
        //likeContainer.style.right = '10px';
        //likeContainer.style.backgroundColor = 'rgba(0, 0, 0, 0.6)';
        likeContainer.style.padding = '5px 10px';
        likeContainer.style.borderRadius = '20px';

        itemDiv.appendChild(likeContainer);

        // Optional: add click event
        itemDiv.addEventListener('click', () => {
          //alert(`You clicked on ${movie.title}`);
        });

        document.querySelector('.movie-row').appendChild(itemDiv);

      });
    }
    //createFeed(movies);

    items = Array.from(document.querySelectorAll('.movie-row .movie-item'));


    const searchInput = document.getElementById('search');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();

      items.forEach(item => {
        const text = item.querySelector('.movie-title').textContent.toLowerCase();
        if (text.includes(query)) {
          // Show
          item.style.display = 'block'; // Make it visible
          // Allow layout to update
          requestAnimationFrame(() => {
            item.classList.remove('hide');
          });
        } else {
          // Animate out
          item.classList.add('hide');

          // After transition, set display:none
          item.addEventListener('transitionend', () => {
            if (item.classList.contains('hide')) {
              item.style.display = 'none';
            }
          }, { once: true });
        }
      });

    });

    document.getElementById('sortBtn').addEventListener('click', () => {
      const m = movies.sort((a, b) => a.title.localeCompare(b.title));
      rowContainer.innerHTML = '';
      createFeed(m);
    });

  </script>

</body>
</html>
