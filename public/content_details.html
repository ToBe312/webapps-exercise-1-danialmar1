<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>מסך בחירת תוכן</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <style>
    body {
      background-color: #000; /* black background for streaming vibe */
      margin: 0;
      padding: 0;
    }
    /* Style for the navbar */
    .navbar {
      background-color: #141414; /* dark background similar to Netflix */
    }
    /* Logo styling */
    .navbar-brand img {
      height: 40px;
    }

    .navbar .btn {
        text-decoration: none;
    }

    .navbar .btn:hover {
        background-color: #343434;
        transform: scale(1.03);
        border-bottom: 3px solid #797cc2;
    }
  </style>
  <style>
    body {
      color: #fff;
    }
    /* Additional styling as needed */
    .content-header {
      display: flex;
      align-items: center;
      margin-top: 20px;
    }
    .poster {
      max-width: 300px;
      margin-right: 20px;
    }
    .actions {
      margin-top: 10px;
    }
    .similar-content {
      display: flex;
      overflow-x: auto;
      margin-top: 20px;
    }
    .similar-item {
      flex: 0 0 auto;
      margin-right: 10px;
      width: 150px;
    }
    .episode-list {
      margin-top: 20px;
    }
    .actor-list {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
    }
    .actor {
      margin: 5px 10px;
      cursor: pointer;
      color: #797cc2;
    }
  </style>
  <style>
    .movie-row {
      gap: 10px;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .movie-item {
      width: 200px;
      flex-shrink: 0;
      transition: opacity 0.3s, max-height 0.3s;
      /*max-height: 100px; /* or some max value */

    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .movie-poster:hover {
      transform: scale(1.05);
    }

    .movie-title {
      font-size: 14px;
      font-weight: bold;
      color: aquamarine;
      text-shadow: #555;
      padding-right: 2px;
    }

    /* Optional: add hover effect for the like container if you want to animate opacity */
    .like-container {
      opacity: 0;
      transition: opacity 0.3s;
      color: pink;
    }

    .movie-item:hover .like-container {
      opacity: 1;
    }

    .like-b {
      color: #ccc;
      font-size: 30px;
    }

    .hide {
      opacity: 0;
      max-height: 0;
    }

    .sort-button {
      opacity: 0;
      transition: opacity 0.3s;

      font-size: 20px;
      cursor: pointer;
    }

    .movie-feed-container h2:hover .sort-button {
      opacity: 1;
    }
  </style>
</head>
<body dir="rtl">
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
      <!-- Logo -->
      <a class="navbar-brand" href="#">
        <img src="images/CORNFLEX2.png" alt="Logo" />
      </a>
      <!-- Navigation buttons -->
      <div class="d-flex ms-auto">
        <button class="btn btn-link text-white mx-2">מסך הבית</button>
        <button class="btn btn-link text-white mx-2">סדרות</button>
        <button class="btn btn-link text-white mx-2">סרטים</button>
        <button class="btn btn-link text-white mx-2">חדש ופופולרי</button>
        <button class="btn btn-link text-white mx-2">הרשימה שלי</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container my-4">
    <!-- 1. Main info section -->
    <div class="content-header">
      <img src="content-poster.jpg" id="content-poster" class="poster" alt="Content Poster" />
      <div>
        <h2 id="content-title">Content Title</h2>
        <p id="content-overview">Brief synopsis of the content...</p>
        <p><strong>רייטינג:</strong> <span id="content-rating">8.5</span></p>
        <p><strong>שנה:</strong> <span id="content-year">2023</span></p>
        <!-- Add more info as needed -->
        <div class="actions">
          <button class="btn btn-primary me-2" id="continue-watching">המשך צפייה</button>
          <button class="btn btn-secondary me-2" id="watch-from-start">צפייה מההתחלה</button>
          <button type="button" id="like-btn" class="btn btn-sm p-0 m-0 like-b" style="font-size: 1.5rem;">👍</button>
        </div>
      </div>
    </div>

    <!-- 2. Series episodes (if applicable) -->
    <div class="episode-list" id="episode-list" style="display:none;">
      
    </div>

    <!-- 3. Similar Content -->
    <div class="similar-content" id="similar-content-section">
      <h4>Similar Content</h4>
      <div class="similar-content" id="similar-content"></div>
    </div>

    <!-- 4. Actors -->
    <div class="" id="actor-list">
      <h4>Actors</h4>
      <!-- Actors will be appended here -->
    </div>
  </div>

  <script>
    const profile = JSON.parse(localStorage.getItem('profile')) || {
      '_id': 0,
      'name': 'User',
      'img': ''
    };

    const baseImageUrl = "images/";
    
    // נניח שה־id של התוכן מגיע ב־URL: content.html?id=123&type=movie
    const params = new URLSearchParams(window.location.search);
    const contentId = params.get('id');
    const type = params.get('type'); // 'movie' או 'series'
    const profileId = localStorage.getItem('profileId');

    async function loadContent() {
        const res = await fetch(`/content/${type}/${contentId}`);
        const content = await res.json();
        console.log(content);

        const res_liked = await fetch(`/likes/toggle`, { method: 'POST', headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
              contentId,
              type
            }) });
          const data_liked = await res_liked.json();
          //alert('עודכן בהצלחה!');
          document.getElementById('like-btn').innerText = data_liked.liked ? '👍' : '🖒';

        document.getElementById('content-poster').src = baseImageUrl + content.posterPath;
        document.getElementById('content-title').textContent = content.title;
        document.getElementById('content-overview').textContent = content.overview;
        document.getElementById('content-year').textContent = new Date(content.releaseDate).getFullYear();
        document.getElementById('content-rating').textContent = content.rating;

        // שחקנים
        const castList = document.getElementById('actor-list');
        castList.innerHTML = 
        `
        <div class="movie-feed-container my-4">
          <h2 class="text-white mx-4">
            שחקנים
            <a id="sortBtn" class="small text-decoration-none sort-button">מיין לפי שם (א"ב)</a>
          </h2>
          <div class="movie-row d-flex overflow-auto px-4">
            ${content.cast.map(c =>
              `
              <div class="movie-item" onclick="window.open('https://he.wikipedia.org/wiki/${encodeURIComponent(c.name)}', '_blank')" >
                <img src="${c.profilePath}" alt="${c.name}" class="movie-poster">
                <div class="movie-title">
                  ${c.name}
                </div>
              </div>`
            ).join('')}
          </div>
        </div>
      `;
        /*
        content.cast.map(c =>
            `<li><a href="https://he.wikipedia.org/wiki/${encodeURIComponent(c.name)}" target="_blank">${c.name}</a></li>`
        ).join('');
        */
        
        //throw new Error('stop right now');
        // תכנים דומים
        /*
        const similarRes = await fetch(`/content/${type}/${contentId}/similar`);
        const similar = await similarRes.json();
        const similarContainer = document.getElementById('similar');
        similarContainer.innerHTML = similar.map(s =>
            `<div class="p-2"><img src="${s.posterPath}" width="120"><p>${s.title}</p></div>`
        ).join('');
        */
        // אם זה סדרה → רשימת פרקים
        if (type === 'series') {
            const episodeList = document.getElementById('episode-list');
            episodeList.style.display = 'block';
            const episodesRes = await fetch(`/content/series/${contentId}/episodes`);
            const episodes = await episodesRes.json();
            const first = episodes[0];

            const lastWatchedRes = await fetch(`/watch/lastEpisode?profileId=${profile._id.toString()}&seriesId=${contentId}`);
            const lastWached = await lastWatchedRes.json();

            if (lastWached) {
              // יש פרק אחרון בסדרה הזו
              document.getElementById('continue-watching').onclick = () => {
                window.location.href = `/player.html?type=series&id=${contentId}&episodeId=${lastWached.episodeId}`;
              }
              document.getElementById('continue-watching').innerText += 
                `(עונה ${lastWached.seasonNumber} פרק ${lastWached.episodeNumber})`;
            } else {
              // לא נמצא → מתחילים מהפרק הראשון
              document.getElementById('continue-watching').style.display = 'none';
            }
            document.getElementById('watch-from-start').onclick = () => {
              // await fetch(`/watch/restart/${type}/${contentId}`, { method: 'POST' });
              window.location.href = `/player.html?type=series&id=${contentId}&episodeId=${first._id}`;
            }

            //const episodesList = document.getElementById('episodes');

            const seasons = [...new Set(episodes.map(e => e.seasonNumber))]
            episodeList.innerHTML = seasons.map(s => `
        <div class="movie-feed-container my-4">
          <h2 class="text-white mx-4">
            עונה ${s}
          </h2>
          <div class="movie-row d-flex overflow-auto px-4">
            ${episodes.filter(e => e.seasonNumber === s).map(e =>
              `
              <div class="movie-item"  onclick="window.location.href = '/player.html?type=series&id=${contentId}&episodeId=${e._id}'">
                <img src="${e.stillPath || baseImageUrl + content.posterPath}" alt="${e.title}" class="movie-poster">
                <div class="movie-title">
                  ${e.title}
                  ${e.lastPosition ? `<span class="badge bg-info">נמשך מהדקה ${Math.floor(e.lastPosition/60)}</span>` : ''}
                </div>
              </div>`
            ).join('')}
          </div>
        </div>
      `).join('');
            /*episodesList.innerHTML = episodes.map(e =>
            `<li class="list-group-item episode-item">
                עונה ${e.seasonNumber}, פרק ${e.episodeNumber} - ${e.title}
                ${e.lastPosition ? `<span class="badge bg-info">נמשך מהדקה ${Math.floor(e.lastPosition/60)}</span>` : ''}
            </li>`
            ).join('');*/
        } else {
            document.getElementById('episode-list').style.display = 'none';
            const lastWatchedRes = await fetch(`/watch/isWatched?profileId=${profile._id.toString()}&contentId=${contentId}`);
            const lastWached = await lastWatchedRes.json();
            console.log(lastWached)
            if (lastWached.watched) {
              document.getElementById('continue-watching').onclick = () => {
                window.location.href = `/player.html?type=movie&id=${contentId}`;
              }
              
            } else {
              // לא נמצא → מתחילים מהפרק הראשון
              document.getElementById('continue-watching').style.display = 'none';
            }
            
            document.getElementById('watch-from-start').onclick = () => {
                window.location.href = `/player.html?type=movie&id=${contentId}`;
            }
        }

        const rowContainer = document.querySelectorAll('.movie-row');
    
        rowContainer.forEach(r => 
        { 
        r.addEventListener('wheel', (e) => {
            e.preventDefault(); // Prevent default page scroll
            const delta = -Math.sign(e.deltaY);
            // Scroll left or right based on wheel direction
            const scrollAmount = delta * 300; // Adjust 100 for scroll speed
            r.scrollBy({
                left: scrollAmount,
                behavior: 'smooth'
            });
        })});

        // לייק
        document.getElementById('like-btn').addEventListener('click', async () => {
          const res = await fetch(`/likes/toggle`, { method: 'POST', headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
              contentId,
              type
            }) });
          const data = await res.json();
          //alert('עודכן בהצלחה!');
          document.getElementById('like-btn').innerText = data.liked ? '👍' : '🖒';
        });
    }


    loadContent();
    
/*
    // Populate similar content
    const similarContainer = document.getElementById('similar-content');
    contentData.similar.forEach(item => {
      const div = document.createElement('div');
      div.className = 'card me-2';
      div.style.width = '150px';
      div.innerHTML = `
        <img src="${item.poster}" class="card-img-top" alt="${item.title}">
        <div class="card-body p-2">
          <p class="card-text">${item.title}</p>
        </div>
      `;
      div.onclick = () => {
        alert(`Loading details for ${item.title}`);
      };
      similarContainer.appendChild(div);
    });
*/
  </script>
</body>
</html>
