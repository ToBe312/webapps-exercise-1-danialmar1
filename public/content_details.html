<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>מסך בחירת תוכן</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <style>
    body {
      background-color: #000; /* black background for streaming vibe */
      margin: 0;
      padding: 0;
    }
    /* Style for the navbar */
    .navbar {
      background-color: #141414; /* dark background similar to Netflix */
    }
    /* Logo styling */
    .navbar-brand img {
      height: 40px;
    }

    .navbar .btn {
        text-decoration: none;
    }

    .navbar .btn:hover {
        background-color: #343434;
        transform: scale(1.03);
        border-bottom: 3px solid #797cc2;
    }
  </style>
  <style>
    body {
      color: #fff;
    }
    /* Additional styling as needed */
    .content-header {
      display: flex;
      align-items: center;
      margin-top: 20px;
    }
    .poster {
      max-width: 300px;
      margin-right: 20px;
    }
    .actions {
      margin-top: 10px;
    }
    .similar-content {
      display: flex;
      overflow-x: auto;
      margin-top: 20px;
    }
    .similar-item {
      flex: 0 0 auto;
      margin-right: 10px;
      width: 150px;
    }
    .episode-list {
      margin-top: 20px;
    }
    .actor-list {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
    }
    .actor {
      margin: 5px 10px;
      cursor: pointer;
      color: #797cc2;
    }
  </style>
  <style>
    .movie-row {
      gap: 10px;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .movie-item {
      width: 200px;
      flex-shrink: 0;
      transition: opacity 0.3s, max-height 0.3s;
      /*max-height: 100px; /* or some max value */

    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .movie-poster:hover {
      transform: scale(1.05);
    }

    .movie-title {
      font-size: 14px;
      font-weight: bold;
      color: aquamarine;
      text-shadow: #555;
      padding-right: 2px;
    }

    /* Optional: add hover effect for the like container if you want to animate opacity */
    .like-container {
      opacity: 0;
      transition: opacity 0.3s;
      color: pink;
    }

    .movie-item:hover .like-container {
      opacity: 1;
    }

    .like-b {
      color: #ccc;
      font-size: 30px;
    }

    .hide {
      opacity: 0;
      max-height: 0;
    }

    .sort-button {
      opacity: 0;
      transition: opacity 0.3s;

      font-size: 20px;
      cursor: pointer;
    }

    .movie-feed-container h2:hover .sort-button {
      opacity: 1;
    }
  </style>
</head>
<body dir="rtl">
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
      <!-- Logo -->
      <a class="navbar-brand" href="#">
        <img src="images/CORNFLEX2.png" alt="Logo" />
      </a>
      <!-- Navigation buttons -->
      <div class="d-flex ms-auto">
        <button class="btn btn-link text-white mx-2">מסך הבית</button>
        <button class="btn btn-link text-white mx-2">סדרות</button>
        <button class="btn btn-link text-white mx-2">סרטים</button>
        <button class="btn btn-link text-white mx-2">חדש ופופולרי</button>
        <button class="btn btn-link text-white mx-2">הרשימה שלי</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container my-4">
    <!-- 1. Main info section -->
    <div class="content-header">
      <img src="content-poster.jpg" id="content-poster" class="poster" alt="Content Poster" />
      <div>
        <h2 id="content-title">Content Title</h2>
        <p id="content-overview">Brief synopsis of the content...</p>
        <p><strong>רייטינג:</strong> <span id="content-rating">8.5</span></p>
        <p><strong>שנה:</strong> <span id="content-year">2023</span></p>
        <!-- Add more info as needed -->
        <div class="actions">
          <button class="btn btn-primary me-2" id="continue-watching">המשך צפייה</button>
          <button class="btn btn-secondary me-2" id="watch-from-start">צפייה מההתחלה</button>
          <button class="btn btn-outline-white" id="like-btn">Like</button>
        </div>
      </div>
    </div>

    <!-- 2. Series episodes (if applicable) -->
    <div class="episode-list" id="episode-list" style="display:none;">
      
    </div>

    <!-- 3. Similar Content -->
    <div class="similar-content" id="similar-content-section">
      <h4>Similar Content</h4>
      <div class="similar-content" id="similar-content"></div>
    </div>

    <!-- 4. Actors -->
    <div class="" id="actor-list">
      <h4>Actors</h4>
      <!-- Actors will be appended here -->
    </div>
  </div>

                left: scrollAmount,

    document.getElementById('content-synopsis').textContent = contentData.synopsis;
    document.getElementById('content-rating').textContent = contentData.rating;
    document.getElementById('content-year').textContent = contentData.year;
    document.querySelector('.content-header img').src = contentData.poster;

    // Show episodes if content is series
    if (contentData.isSeries) {
      document.getElementById('episode-list').style.display = 'block';
      const episodesContainer = document.getElementById('episodes');
      contentData.episodes.forEach(ep => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';
        li.innerHTML = `${ep.title} <span>Paused at: ${ep.pausedAt || 'Not watched'}</span>`;
        // Add click event to switch episode
        li.onclick = () => {
          alert(`Switching to ${ep.title}`);
        };
        episodesContainer.appendChild(li);
      });
    }

    // Populate similar content
    const similarContainer = document.getElementById('similar-content');
    contentData.similar.forEach(item => {
      const div = document.createElement('div');
      div.className = 'card me-2';
      div.style.width = '150px';
      div.innerHTML = `
        <img src="${item.poster}" class="card-img-top" alt="${item.title}">
        <div class="card-body p-2">
          <p class="card-text">${item.title}</p>
        </div>
      `;
      div.onclick = () => {
        alert(`Loading details for ${item.title}`);
      };
      similarContainer.appendChild(div);
    });

    // Populate actors
    const actorContainer = document.getElementById('actor-list');
    contentData.actors.forEach(actor => {
      const span = document.createElement('span');
      span.className = 'actor';
      span.textContent = actor.name;
      span.onclick = () => {
        window.open(actor.wikipedia, '_blank');
      };
      actorContainer.appendChild(span);
    });

    // Like button toggle
    const likeBtn = document.getElementById('like-btn');
    let liked = false;
    likeBtn.onclick = () => {
      liked = !liked;
      likeBtn.textContent = liked ? 'Unlike' : 'Like';
    };

    // Continue Watching / Watch Buttons
    document.getElementById('continue-watching').onclick = () => {
      alert('Continuing from where you left off...');
    };
    document.getElementById('watch-from-start').onclick = () => {
      alert('Watching from the beginning...');
    };
  </script>
</body>
</html>
