<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מסך התחברות</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <style>
  /* Background style */
  #vidBackground {
	  position: fixed;
	  right: 0;
	  bottom: 0;
	  min-width: 100%;
	  min-height: 100%;
  }
  </style>
</head>
<body dir=rtl class="bg-light d-flex align-items-center justify-content-center vh-100">
  <video autoplay muted loop id="vidBackground">
	<source src="videos/back3.mp4" type="video/mp4">
  </video>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card shadow p-4 rounded" style="background-color: antiquewhite; opacity: 0.8;">
          <h3 class="card-title text-center mb-4">כניסה לחשבון</h3>
          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">כתובת אימייל</label>
              <input type="email" class="form-control" id="email" placeholder="הזן כאן אימייל..." required />
              <div class="invalid-feedback" id="emailError"></div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">סיסמא</label>
              <input type="password" class="form-control" id="password" placeholder="הזן כאן סיסמא..." required />
              <div class="invalid-feedback" id="passwordError"></div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" />
                <label class="form-check-label" for="rememberMe">
                  זכרו אותי
                </label>
              </div>
              <a href="#" class="small text-decoration-none">שכחת את הסיסמה?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100">היכנס</button>
            <div class="text-center">
              <p class="mb-0">אין לך מנוי אצלנו? זה הזמן  <a href="#" class="text-decoration-none">להצטרף</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // prevent actual submission for validation

      let valid = true;

      // Reset previous errors
      emailError.textContent = '';
      emailInput.classList.remove('is-invalid');
      passwordError.textContent = '';
      passwordInput.classList.remove('is-invalid');

      // Validate email
      if (!emailInput.value) {
        emailError.textContent = 'יש להזין כתובת אימייל.';
        emailInput.classList.add('is-invalid');
        valid = false;
      } else {
        // Additional email pattern validation if needed
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(emailInput.value)) {
          emailError.textContent = 'נא להזין כתובת אימייל תקינה.';
          emailInput.classList.add('is-invalid');
          valid = false;
        }
      }

      // Validate password length
      if (!passwordInput.value) {
        passwordError.textContent = 'יש להזין סיסמא.';
        passwordInput.classList.add('is-invalid');
        valid = false;
      } else if (passwordInput.value.length < 6) {
        passwordError.textContent = 'סיסמא חייבת להיות לפחות 6 תווים.';
        passwordInput.classList.add('is-invalid');
        valid = false;
      }

      // If all validations pass, you can proceed
      if (valid) {

        // Send fetch
        try {
          const res = await fetch('/user/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
              email: emailInput.value,
              password: passwordInput.value
            })
          });
          
          const data = await res.json();
          if (res.ok) {
            // Save login state
            localStorage.setItem('isLoggedIn', 'true');

            // User info
            localStorage.setItem('userEmail', emailInput.value);
            //localStorage.setItem('userId', data._id);

            // Redirect
            window.location.href = 'Profiles.html';
          }
          else if(res.status == 401) {
            passwordError.textContent = 'פרטי התחברות שגויים';
            passwordInput.classList.add('is-invalid');
          } 
          else {
            alert('שגיאה: ' + data.error);
          }
        } catch (err) {
          alert('אין חיבור לשרת');
        }
      }
    });
  </script>
</body>
</html>
