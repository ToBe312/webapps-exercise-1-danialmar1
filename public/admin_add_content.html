<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - הוספת תוכן</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #141414;
      color: #fff;
      padding: 50px;
    }
    .container {
      max-width: 800px;
      margin: auto;
    }
    input, select, textarea {
      background-color: #1e1e1e;
      color: #fff;
      border: 1px solid #444;
    }
    label {
      margin-top: 10px;
    }
  </style>
</head>
<body dir="rtl">
  <div class="container">
    <h1>הוספת תוכן חדש</h1>
    <form id="addContentForm">
      <label>סוג תוכן</label>
      <select id="contentType" required>
        <option value="movie">סרט</option>
        <option value="series">סדרה</option>
      </select>

      <label>שם</label>
      <input type="text" id="title" required>

      <label>שנה</label>
      <input type="number" id="releaseDate" required>

      <label>ז'אנר</label>
      <input type="text" id="genres" placeholder="פירוט בז'אנר מופרד בפסיקים" required>

      <label>תקציר</label>
      <textarea id="overview" rows="3" required></textarea>

      <label>דירוג (0-10)</label>
      <input type="number" id="rating" min="0" max="10" step="0.1" required>

      <label>שחקנים (פירוט שמות מופרדים בפסיקים)</label>
      <input type="text" id="cast">

      <label>תמונה (Poster)</label>
      <input type="file" id="poster">

      <label>קובץ וידאו</label>
      <input type="file" id="video">

      <button type="submit" class="btn btn-danger mt-3">הוסף תוכן</button>
    </form>

    <div id="message" class="mt-3"></div>
  </div>

  <script>
    const form = document.getElementById('addContentForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const type = document.getElementById('contentType').value;
      const title = document.getElementById('title').value;
      const releaseDate = document.getElementById('releaseDate').value;
      const genres = document.getElementById('genres').value.split(',').map(g => g.trim());
      const overview = document.getElementById('overview').value;
      const rating = parseFloat(document.getElementById('rating').value);
      const cast = document.getElementById('cast').value.split(',').map(name => ({ name: name.trim() }));
      const poster = document.getElementById('poster').files[0];
      const video = document.getElementById('video').files[0];

      const formData = new FormData();
      formData.append('type', type);
      formData.append('title', title);
      formData.append('releaseDate', releaseDate);
      formData.append('genres', JSON.stringify(genres));
      formData.append('overview', overview);
      formData.append('rating', rating);
      formData.append('cast', JSON.stringify(cast));
      if (poster) formData.append('poster', poster);
      if (video) formData.append('video', video);

      try {
        const res = await fetch('/admin/add', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        if (res.ok) {
          messageDiv.innerHTML = `<div class="alert alert-success">התוכן נוסף בהצלחה: ${data.title}</div>`;
          form.reset();
        } else {
          messageDiv.innerHTML = `<div class="alert alert-danger">שגיאה: ${data.error}</div>`;
        }
      } catch (err) {
        messageDiv.innerHTML = `<div class="alert alert-danger">שגיאה בשרת</div>`;
      }
    });
  </script>
</body>
</html>
